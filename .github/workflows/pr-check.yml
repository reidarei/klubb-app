# CI-sjekk for endringer mot main. `pull_request` har nå TO mulige omfang, og
# `push` har to til:
#
#   pull_request, risiko funnet     → FULL   (~7–8 min veggklokke): kjerneport + Playwright-e2e
#   pull_request, lav risiko (#663) → KJERNE (~3 min):  ingen fil kan påvirke en flyt
#   push, direkte til main          → KJERNE (~3 min):  lint, typecheck, vitest, bygg
#   push, merget PR                 → INGEN  (<1 min):    alt portet på PR-en alt; kun budsjettvaktens cache varmes (#851)
#
# Kjerneporten er fordelt på to parallelle jobber: `kjerne` (lint, typesjekk,
# vitest) og `sjekk` (bygg, og e2e når den skal kjøre). Tidene over er fra
# oktober 2026 — mål på nytt med .github/scripts/ci-tidsbruk.mjs.
#
# E2e hoppes over av tre, uavhengige grunner (se `steps.omfang.outputs.aarsak`
# under «Avgjør e2e-omfang»):
#   - hendelse: `push` — kjørte allerede på PR-en (se lenger ned).
#   - lav_risiko: ingen endret fil kan påvirke en kjørende flyt (#663,
#     .github/scripts/e2e-risiko.mjs) — normalt, ingen dekning tapt.
#   - budsjett: budsjettvakten kuttet fordi månedskvoten er stram
#     (.github/scripts/ci-minuttbudsjett.mjs) — PR-en ER ikke e2e-dekket,
#     behandle som «ukjent», ikke «grønt».
#
# Kjerneporten er ubetinget i alle tilfeller og skal aldri ofres. E2e ligger i
# samme job som bygget (`sjekk`), som e2e serverer. Merge-loopen i agentic
# venter på BÅDE `kjerne` og `sjekk` — se .claude/commands/agentic.md steg 10.
#
# `sjekk` kjører på EGEN RUNNER (hjemmeserveren) når repo-variabelen
# SJEKK_RUNNER er satt (#891). Da er budsjett-grunnen over borte: minuttene
# teller ikke mot kvoten, og e2e kjører på hver PR med risiko. `kjerne` er
# billig og blir på GitHub, så de to jobbene fortsatt går parallelt.
#
# Build-steget bruker dummy-env (eller lokal Supabase sine faste dev-verdier
# når e2e kjører) slik at ingen ekte secrets trengs. E2e-instansen
# startes fra bunn i selve jobben (fersk `supabase start`) — se e2e/README.md
# § Sikkerhetsmodellen for hvorfor det er trygt, og docs/ci-minuttbudsjett.md
# for hvorfor e2e kan bli kuttet eller hoppet over også på en PR.
# E2e-steget inkluderer også e2e/rls/ (#533) — RLS-policyene verifiseres her
# med ekte anon/authenticated-klienter, ikke bare service_role.

name: PR-sjekk

on:
  pull_request:
    branches: [main]
  # Push til main kjører KJERNEPORTEN (lint/typecheck/vitest/bygg), aldri e2e.
  # Bakgrunn: workflowen kjørte tidligere kun på pull_request, og 7 av de siste
  # 30 commitene på main var direkte pushes — de fikk null porter. Pipelinen har
  # dessuten en legitim direkte-push-sti (agentic steg 10.5, typeregenerering
  # etter migrasjon), så hullet var strukturelt og ikke bare slurv.
  #
  # Hvorfor ikke e2e her: kom endringen via PR, var e2e allerede grønt der, og
  # en ny full kjøring per merge ville doblet forbruket (~290 min/mnd) og spist
  # mesteparten av driftsreserven på 700. Kjerneporten koster ~5,5 min mot
  # ~14,5 for full — vi kjøper mesteparten av verdien for en tredjedel.
  #
  # …men på en MERGE-commit kjøper vi ingenting: den koden ble nettopp testet på
  # PR-en. Augusts tall: 56 push-kjøringer, 242 min, 0 funn — 19 % av
  # månedskvoten brukt på å re-teste kode som var grønn minutter før, mens
  # budsjettvakten samtidig kuttet e2e på PR-ene (#609). Kjerneporten hoppes
  # derfor over når commiten har en merget PR; direkte pushes — hullet denne
  # triggeren finnes for — får den fortsatt. Se «Avgjør omfang» under.
  push:
    branches: [main]
  # Manuell kjøring. `e2e: true` tvinger full suite uavhengig av risiko og
  # budsjett — til å verifisere egen runner (#891) etter omstart, oppgradering
  # eller endring i oppsettet, uten å måtte lage en PR som rører app-kode:
  #   gh workflow run pr-check.yml --ref main -f e2e=true
  workflow_dispatch:
    inputs:
      e2e:
        description: 'Kjør full e2e-suite uansett risiko og budsjett'
        type: boolean
        default: false

# actions:read kreves av budsjettvakten (leser egne workflow-runs for å måle
# forbrukte CI-minutter denne måneden), samme mønster som db-restore-drill.yml.
# pull-requests:read lar «Avgjør omfang» slå opp om en push-commit kom fra en
# merget PR.
permissions:
  contents: read
  actions: read
  pull-requests: read

# Avbryt pågående run for samme branch ved nytt push — sparer CI-tid.
# Gruppen inkluderer workflow-navn slik at fremtidige workflows ikke
# kolliderer med denne på samme ref.
#
# cancel-in-progress KUN på pull_request: der er en ny push til branchen et
# signal om at forrige kjøring er uinteressant. På main er hver kjøring knyttet
# til en commit som allerede ER historikk — kansellerer vi den, står commiten
# igjen uten port, som er nøyaktig hullet push-triggeren over skulle lukke.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, typesjekk og vitest i en EGEN jobb som kjører parallelt med `sjekk`
  # (bygg + e2e). Før lå alt i én jobb etter hverandre, og en PR ventet
  # 10–16 min; nå er veggklokka omtrent lik `sjekk` alene. Prisen er én ekstra
  # checkout + npm ci (~40 s Actions-minutter per kjøring). `kjerne` tar ~3,5
  # min og er ikke på kritisk sti — det er `sjekk` (bygg + e2e).
  # Agentic venter på BEGGE jobbene før merge (se .claude/commands/agentic.md
  # steg 10) — et eget job er ikke lenger usynlig for vente-loopen.
  kjerne:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Samme oppslag som i `sjekk` under — duplisert heller enn delt via et
      # tredje forjobb, som ville lagt ~15 s oppstart foran begge jobbene.
      - name: Avgjør om commiten alt er portet
        id: portet
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          antall=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.merged_at != null)] | length' 2>/dev/null) || antall=""
          if [ -n "$antall" ] && [ "$antall" -gt 0 ]; then
            echo "hopp=true" >> "$GITHUB_OUTPUT"
          else
            echo "hopp=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.portet.outputs.hopp != 'true'
        with:
          node-version: 22
          cache: 'npm'

      - name: Installer avhengigheter
        if: steps.portet.outputs.hopp != 'true'
        run: npm ci

      - name: Lint
        if: steps.portet.outputs.hopp != 'true'
        run: npm run lint

      - name: Typesjekk
        if: steps.portet.outputs.hopp != 'true'
        run: npm run typecheck

      - name: Test
        if: steps.portet.outputs.hopp != 'true'
        run: npm test

  sjekk:
    # Egen runner på hjemmeserveren (#891): repo-variabelen SJEKK_RUNNER settes
    # til `self-hosted` når runneren er oppe, og minuttene teller da ikke mot
    # GitHub-kvoten — e2e kjører på hver PR. Tom/slettet variabel ⇒ GitHub-
    # hosted igjen, uten PR. Fallback-veien når maskinen hjemme er nede:
    #   gh variable delete SJEKK_RUNNER
    # Se docs/ci-minuttbudsjett.md § Egen runner.
    runs-on: ${{ vars.SJEKK_RUNNER || 'ubuntu-latest' }}
    # Bygg + e2e (lint/typesjekk/vitest ligger i `kjerne` over). Målt før
    # splitten: e2e ~4,8 min, bygg ~1,8 min, Supabase-oppstart 1–2 min (delvis
    # parallelt med Chromium). Hjemmeserveren (4 kjerner, 7,6 GB) er tregere
    # enn ubuntu-latest; 35 gir slingring der uten å maskere en jobb som
    # faktisk henger.
    timeout-minutes: 35
    env:
      # kaaring-varsel-retry.spec.ts (linje ~34) skipper hele specen uten denne —
      # den kjører den ekte /api/cron/paaminne-cronen og krever CRON_SECRET-auth.
      # Verdien er en dummy: cronen kjører kun mot den ferske, isolerte
      # test-instansen i denne jobben (se e2e/README.md § Sikkerhetsmodellen).
      CRON_SECRET: ci-dummy-hemmelighet
      # LOKAL_SUPABASE_URL / LOKAL_SUPABASE_PUBLISHABLE_KEY / LOKAL_DB_PORT
      # settes av steget «Lokale Supabase-verdier» under — de avhenger av
      # hvilken runner jobben havnet på.

    steps:
      - uses: actions/checkout@v4

      # Er denne main-commiten allerede portet? En squash-merge er bit-identisk
      # med koden PR-en nettopp kjørte lint/typecheck/vitest/bygg på, så en ny
      # runde kjøper ingenting. Vi slår opp mot API-et i stedet for å lete etter
      # «(#123)» i commit-meldingen — meldingsformatet er en konvensjon, ikke en
      # garanti, og en direkte push med den formen i teksten ville sluppet unna
      # porten stille. Det er nøyaktig feilretningen vi ikke tåler her.
      #
      # Fail-open er med vilje: svarer API-et ikke, kjører vi kjerneporten. Å
      # betale 5,5 min unødvendig er mildere enn å slippe en utestet commit
      # gjennom på en nettverksfeil.
      - name: Avgjør om commiten alt er portet
        id: portet
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          antall=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.merged_at != null)] | length' 2>/dev/null) || antall=""

          if [ -z "$antall" ]; then
            echo "::warning::Kunne ikke slå opp PR for commiten — kjører kjerneporten for sikkerhets skyld."
            echo "hopp=false" >> "$GITHUB_OUTPUT"
          elif [ "$antall" -gt 0 ]; then
            echo "::notice::Commiten kom fra en merget PR og ble portet der — kjerneporten hoppes over."
            echo "hopp=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Direkte push til main uten PR — kjerneporten kjøres."
            echo "hopp=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.portet.outputs.hopp != 'true'
        with:
          node-version: 22
          cache: 'npm'

      # Budsjettvaktens cache over ferdige kjøringer (#851): vakten trenger ett
      # API-kall per kjøring i måneden, og uten cache sprenger det
      # GITHUB_TOKEN-grensen (1000/time) mot månedsslutt. En PR ser bare egne
      # og main sine cacher — derfor kjører vakten også på merget push (under),
      # så main alltid har en fersk cache å starte fra.
      - name: Hent minuttcache
        if: github.event.repository.private
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ci-minutter
          key: ci-minutter-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ci-minutter-

      # Budsjettvakt (#534) — kjøres FØR npm ci med vilje: den er ren Node uten
      # avhengigheter, og et kutt her skal ikke betale for docker-pull/npm
      # install vi likevel ikke trenger. Se .github/scripts/ci-minuttbudsjett.mjs
      # og docs/ci-minuttbudsjett.md.
      #
      # Kjører også når commiten alt er portet (system-Node, ingen setup-node):
      # da er resultatet uten betydning, men den varmer main-cachen over (#851).
      # Koster noen sekunder i en jobb som uansett faktureres som 1 min.
      - name: CI-minuttbudsjett
        id: budsjett
        # Ren cache-varming når commiten alt er portet — en målefeil der skal ikke gi rød main.
        continue-on-error: ${{ steps.portet.outputs.hopp == 'true' }}
        env:
          REPO_PRIVAT: ${{ github.event.repository.private }}
          GITHUB_TOKEN: ${{ github.token }}
          CI_MINUTT_CACHE: ${{ runner.temp }}/ci-minutter/cache.json
        run: node .github/scripts/ci-minuttbudsjett.mjs

      # Også når vakten feilet: det den rakk å hente, skal ikke hentes igjen.
      - name: Lagre minuttcache
        if: ${{ !cancelled() && github.event.repository.private }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ci-minutter
          key: ci-minutter-${{ github.run_id }}-${{ github.run_attempt }}

      # Risiko-gating av e2e (#663) — kjøres ETTER budsjettvakten (så
      # forbrukstabellen fortsatt skrives på HVER PR, trendgrunnlag for #664)
      # og FØR «Avgjør e2e-omfang». Kun relevant for pull_request — push-
      # kjøringer kjører aldri e2e uansett (se «Avgjør e2e-omfang» under), så
      # å måle risiko der ville vært et bortkastet API-kall.
      - name: Risiko-gating av e2e
        id: risiko
        if: steps.portet.outputs.hopp != 'true' && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMMER: ${{ github.event.pull_request.number }}
          ENDREDE_FILER: ${{ github.event.pull_request.changed_files }}
        run: node .github/scripts/e2e-risiko.mjs

      # Ett sted å resonnere om «skal e2e kjøre». Tre uavhengige grunner til å
      # hoppe over, samlet her i stedet for duplisert på seks steg-betingelser
      # (der ett glemt ledd ville gitt en jobb som starter Supabase den ikke
      # bruker — eller verre, kjører e2e vi trodde var av).
      #
      # MERK: risiko-STEGET kjører etter budsjett-steget over — bevisst, så
      # forbrukstabellen skrives på hver PR (trendgrunnlag for #664). Det er
      # PRIORITETEN i if-kjeden under som setter risiko foran budsjett, ikke
      # stegrekkefølgen. De to må ikke forveksles.
      #
      # RISIKO PRIORITERES FORAN BUDSJETT, bevisst: en dok-PR i en stram måned skal
      # få `aarsak=lav_risiko` (normalt, forventet), ikke `aarsak=budsjett`
      # (som eskaleres som «ukjent dekning», se docs/ci-minuttbudsjett.md).
      # Snur du rekkefølgen, eskalerer pipelinen på noe helt normalt hver
      # gang budsjettet er stramt samtidig som noen pusher en README-fiks.
      - name: Avgjør e2e-omfang
        id: omfang
        if: steps.portet.outputs.hopp != 'true'
        env:
          HENDELSE: ${{ github.event_name }}
          RISIKO: ${{ steps.risiko.outputs.risiko }}
          BUDSJETT_OK: ${{ steps.budsjett.outputs.kjor_e2e }}
          # På egen runner koster jobben ingen kvoteminutter, så budsjettvakten
          # har ingenting å verne — den kjører fortsatt (skriver tabellen), men
          # kuttet hennes ignoreres her (#891).
          SELVHOSTET: ${{ runner.environment == 'self-hosted' }}
          TVING_E2E: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e }}
        run: |
          if [ "$TVING_E2E" = "true" ]; then
            echo "::notice::Manuell kjøring med e2e=true — full suite uansett risiko og budsjett."
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            echo "aarsak=manuelt" >> "$GITHUB_OUTPUT"
          elif [ "$HENDELSE" != "pull_request" ]; then
            echo "::notice::$HENDELSE mot main — kjerneporten kjøres, e2e hoppes over (kjørte allerede på PR-en)."
            echo "e2e=false" >> "$GITHUB_OUTPUT"
            echo "aarsak=hendelse" >> "$GITHUB_OUTPUT"
          # `= "false"`, ikke `!= "true"`: en TOM eller ukjent verdi (steget
          # ble hoppet over, skriptet døde før den skrev output) er «ikke
          # målt», ikke «lav risiko». Den skal falle videre til budsjett/kjorer
          # slik at e2e KJØRER. Skriptet feiler åpent internt — denne ene linja
          # er stedet hele den polariteten kan snus ved et uhell.
          elif [ "$RISIKO" = "false" ]; then
            echo "::notice::Ingen endret fil kan påvirke en kjørende flyt — e2e hoppes over (#663)."
            echo "e2e=false" >> "$GITHUB_OUTPUT"
            echo "aarsak=lav_risiko" >> "$GITHUB_OUTPUT"
          elif [ "$BUDSJETT_OK" != "true" ] && [ "$SELVHOSTET" != "true" ]; then
            echo "::notice::Budsjettvakten kuttet e2e — se docs/ci-minuttbudsjett.md."
            echo "e2e=false" >> "$GITHUB_OUTPUT"
            echo "aarsak=budsjett" >> "$GITHUB_OUTPUT"
          else
            if [ "$SELVHOSTET" = "true" ]; then
              echo "::notice::Egen runner — kvoten er ikke i spill, e2e kjører uansett budsjett (#891)."
            fi
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            echo "aarsak=kjorer" >> "$GITHUB_OUTPUT"
          fi

      # To markørsteg — gjør årsaken maskinlesbar via
      # `gh run view --json jobs` uten å måtte parse::notice-tekst. Se
      # docs/ci-minuttbudsjett.md § Slik ser du om e2e faktisk kjørte.
      #
      # Navnene under (og «E2e (Playwright)» lenger ned) leses bokstavelig av
      # .github/scripts/ci-tidsbruk.mjs (#664) og er pinnet av en test
      # (__tests__/ci-tidsbruk.test.ts) — endrer du et av dem, oppdater
      # konstantene STEG_E2E/MARKOER_LAV_RISIKO/MARKOER_BUDSJETT der også.
      - name: E2e hoppet over — lav risiko
        if: steps.omfang.outputs.aarsak == 'lav_risiko'
        run: echo "Ingen endret fil kan påvirke en kjørende flyt. Se docs/ci-minuttbudsjett.md."

      - name: E2e hoppet over — budsjettvakten kuttet
        if: steps.omfang.outputs.aarsak == 'budsjett'
        run: echo "::warning::PR-en er IKKE e2e-dekket. Behandle som ukjent, ikke grønt."

      - name: Installer avhengigheter
        if: steps.portet.outputs.hopp != 'true'
        run: npm ci

      # Lokal Supabase har FASTE verdier (CLI-ens innebygde dev-nøkkel og
      # portene i supabase/config.toml), og bygget under bruker dem uten å
      # vente på oppstarten — se kommentaren over «Bygg». På EGEN RUNNER (#891)
      # kjører den selvhostede test-instansen (docs/test-instans.md) allerede
      # på samme maskin med nøyaktig disse portene og container-navnene
      # (project_id fra supabase/config.toml). CI-instansen får derfor eget project_id og
      # portene flyttet 543xx → 553xx i jobbens kopi av config.toml, så de to
      # lever side om side; «Vent på Supabase» verifiserer fortsatt at
      # instansen som startet matcher det bygget pekte på.
      - name: Lokale Supabase-verdier
        if: steps.omfang.outputs.e2e == 'true'
        run: |
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            sed -i -E 's/^project_id = .*/project_id = "hk-ci"/; s/^(port|shadow_port|smtp_port|pop3_port) = 543([0-9]{2})$/\1 = 553\2/' supabase/config.toml
            echo "Egen runner: CI-instansen isolert fra test-instansen (project_id hk-ci, porter 553xx)."
            grep -nE '^(project_id|port|shadow_port) = ' supabase/config.toml
            echo "LOKAL_SUPABASE_URL=http://127.0.0.1:55321" >> "$GITHUB_ENV"
            echo "LOKAL_DB_PORT=55322" >> "$GITHUB_ENV"
          else
            echo "LOKAL_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
            echo "LOKAL_DB_PORT=54322" >> "$GITHUB_ENV"
          fi
          echo "LOKAL_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH" >> "$GITHUB_ENV"

      # Bakgrunnsstart: supabase start tar 1-2 min (docker-pull + containere).
      # Startes her, FØR de raske stegene (lint/typecheck/vitest/build), slik at
      # oppstarten skjer parallelt med dem i stedet for sekvensielt etterpå.
      # -x utelater tjenester e2e-suiten ikke bruker (studio, postgres-meta,
      # mailpit, imgproxy, edge-runtime, logflare, vector, supavisor) — færre
      # containere å starte og vedlikeholde i loggen.
      - name: Start Supabase (bakgrunn)
        if: steps.omfang.outputs.e2e == 'true'
        run: |
          # Exit-koden til en bakgrunnsprosess er utilgjengelig for et SENERE
          # steg (`wait` virker kun på egne barn, og hvert run:-steg er sin egen
          # shell). Vi skriver den derfor til en sentinel-fil som ventesteget
          # poller. Uten dette forsvant exit-koden helt — en feilende seed.sql
          # (raise exception-vakten, #534) ville vært usynlig.
          nohup bash -c 'npx supabase start -x studio,postgres-meta,mailpit,imgproxy,edge-runtime,logflare,vector,supavisor > supabase-start.log 2>&1; echo $? > supabase-start.exit' > /dev/null 2>&1 &
          echo "supabase start kjører i bakgrunnen (pid $!)."

      # Flyttet hit (#659) fra rett før «E2e (Playwright)»: der lå de etter
      # «Vent på Supabase», altså ren serietid OPPÅ ventingen på bakgrunns-
      # prosessen over. Her kjører nedlasting/installasjon av Chromium PARALLELT
      # med at `supabase start` jobber i bakgrunnen i stedet for etter den.
      - name: Cache Playwright-browsere
        if: steps.omfang.outputs.e2e == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          # Uten restore-keys ga ENHVER package-lock.json-endring (også en som
          # ikke rører Playwright) full Chromium-nedlasting på nytt. Prefikset
          # treffer forrige cache; `playwright install` legger bare til det som
          # faktisk mangler hvis versjonen har endret seg.
          restore-keys: |
            playwright-${{ runner.os }}-

      # Uten --with-deps: ubuntu-latest har Google Chrome forhåndsinstallert,
      # og dermed systembibliotekene Chromium trenger. --with-deps kjørte
      # apt-get hver gang og ga topper på 6–7 min (snitt ~1 min). --only-shell
      # henter bare headless-shellet, som er det headless-kjøringene bruker.
      # Mangler et bibliotek etter et image-bytte, feiler e2e høylytt — da er
      # svaret å legge --with-deps tilbake, ikke å skippe. På egen runner er
      # bibliotekene installert én gang av oppsettskriptet (#891), og
      # ~/.cache/ms-playwright overlever mellom kjøringer.
      - name: Installer Chromium
        if: steps.omfang.outputs.e2e == 'true'
        run: npx playwright install --only-shell chromium

      # Kjerneporten (lint/typesjekk/vitest) ligger i jobben `kjerne` over og
      # kjører parallelt. Bygget er igjen her fordi e2e serverer artefaktet.

      # Bygget kjører MENS `supabase start` jobber i bakgrunnen (oktober 2026,
      # sparte ~80 s på kritisk sti). Det er trygt fordi lokal Supabase har
      # FASTE verdier: URL-en er alltid 127.0.0.1:54321, og publishable-nøkkelen
      # er CLI-ens innebygde dev-nøkkel (offentlig kjent, ingen hemmelighet).
      # Vi bygger mot disse konstantene (job-env LOKAL_SUPABASE_*), og «Vent på
      # Supabase» KASTER hvis instansen som faktisk startet ga andre verdier.
      # Dermed holder garantien fra #659 — artefaktet appen serverer peker på
      # den ekte test-instansen, aldri på dummy — uten å vente på oppstarten.
      # Artefaktvakten i e2e/global-setup.ts er fortsatt lås nummer to.
      #
      # `next start` (playwright.config.ts sitt `webServer.command` i CI) skal
      # ALDRI bygge selv: RLS-suiten (e2e/rls/) har ingen `dependencies` på
      # setup/chromium og skal få raskest mulig feedback. Ett bygg her — ikke
      # to betingede steg — er et bevisst valg: navnet «Bygg» leses bokstavelig
      # av .github/scripts/ci-tidsbruk.mjs (pinnet i __tests__/ci-tidsbruk.test.ts).
      - name: Bygg
        if: steps.portet.outputs.hopp != 'true'
        env:
          # Uten e2e (kjerneport-only, lav_risiko, budsjett, push) bygges det
          # mot dummy-verdier — bygget kaller aldri ut mot dem.
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.omfang.outputs.e2e == 'true' && env.LOKAL_SUPABASE_URL || 'https://dummy.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.omfang.outputs.e2e == 'true' && env.LOKAL_SUPABASE_PUBLISHABLE_KEY || 'dummy' }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: dummy
          # Sikkerhetskritisk (#659): uten denne blir BLOKKER_UTSENDING false
          # i artefaktet (lib/varsler.ts) fordi BASE_URL ikke lenger ser lokal
          # ut for den SERVERTE appen — `next start` baker NEXT_PUBLIC_*-verdier
          # inn ved byggetid.
          NEXT_PUBLIC_BASE_URL: http://localhost:3100
        run: npm run build

      - name: Vent på Supabase
        if: steps.omfang.outputs.e2e == 'true'
        run: |
          # Vi venter på at `supabase start` er FERDIG — ikke på at
          # `supabase status` svarer. status sjekker kun at db-containeren er
          # frisk (assertContainerHealthy(ctx, utils.DbId)) og lister stoppede
          # tjenester til stderr uten å feile, så den kan bli grønn MENS de 123
          # migrasjonene og seed.sql fortsatt kjører — hvorpå migrasjons-
          # tellingen under leser et delvis antall og gir falsk rødt.
          for i in $(seq 1 60); do
            if [ -f supabase-start.exit ]; then
              echo "supabase start ferdig etter ~$((i * 5)) s."
              break
            fi
            sleep 5
          done

          if [ ! -f supabase-start.exit ]; then
            echo "::error::supabase start ble ikke ferdig innen ~5 minutter. Logg:"
            cat supabase-start.log || true
            exit 1
          fi

          kode=$(tr -d '[:space:]' < supabase-start.exit)
          if [ "$kode" != "0" ]; then
            # Ubetinget logg-dump ved feil: seed.sql-vakten (#534) rapporterer
            # via `raise exception`, og den meldingen finnes KUN her.
            echo "::error::supabase start feilet med exit $kode. Logg:"
            cat supabase-start.log || true
            exit 1
          fi

          # --override-name mapper fra CLI-ens interne feltnavn
          # (api.url / auth.publishable_key / auth.secret_key) til navnene
          # playwright.config.ts og e2e/README.md allerede bruker.
          npx supabase status -o env \
            --override-name api.url=E2E_SUPABASE_URL \
            --override-name auth.publishable_key=E2E_SUPABASE_ANON_KEY \
            --override-name auth.secret_key=E2E_SUPABASE_SERVICE_KEY \
            > supabase-status.env

          # CLI-en formaterer med godotenv.Marshal, som skriver KEY="value" MED
          # hermetegn. $GITHUB_ENV stripper dem IKKE, så uten strippingen her
          # ble NEXT_PUBLIC_SUPABASE_URL bokstavelig talt
          # '"http://127.0.0.1:54321"' — en ugyldig URL, og hele suiten falt.
          sed -E 's/^([A-Z0-9_]+)="(.*)"$/\1=\2/' supabase-status.env > status-strippet.env

          verdi_for() { sed -n "s/^$1=//p" status-strippet.env | tail -n1; }

          # Fallback til de eldre feltnavnene: publishable/secret key er den nye
          # nøkkelgenerasjonen, og en CLI-versjon som ikke fyller dem ville gitt
          # tomme verdier. Da er ANON_KEY/SERVICE_ROLE_KEY fortsatt riktig svar,
          # og vi slipper en rød CI-runde på ren navnedrift.
          url=$(verdi_for E2E_SUPABASE_URL);            [ -n "$url" ]    || url=$(verdi_for API_URL)
          anon=$(verdi_for E2E_SUPABASE_ANON_KEY);      [ -n "$anon" ]   || anon=$(verdi_for ANON_KEY)
          secret=$(verdi_for E2E_SUPABASE_SERVICE_KEY); [ -n "$secret" ] || secret=$(verdi_for SERVICE_ROLE_KEY)

          # Lås 1 mot «grønn på tom luft»: er en av variablene tom (endret
          # feltnavn i en fremtidig CLI, en tjeneste som ikke kom opp), ville
          # HAR_TEST_INSTANS i playwright.config.ts blitt false, hver spec
          # skippet og jobben blitt grønn med NULL dekning. Vi validerer lokale
          # variabler og ikke $E2E_SUPABASE_URL: $GITHUB_ENV slår først inn i
          # NESTE steg, så en `[ -n "$E2E_SUPABASE_URL" ]` her ville alltid vært
          # tom og alltid feilet. Lås 2 er testen i e2e/sikkerhetsvakt.spec.ts.
          feil=0
          sjekk() {
            if [ -z "$2" ]; then
              echo "::error::$1 er tom etter «supabase status -o env» — e2e ville skippet stille og gitt grønn CI uten dekning."
              feil=1
            else
              case "$2" in
                *'"'*|*"'"*)
                  echo "::error::$1 inneholder hermetegn — strippingen traff ikke formatet CLI-en skrev."
                  feil=1
                  ;;
              esac
            fi
          }
          sjekk E2E_SUPABASE_URL "$url"
          sjekk E2E_SUPABASE_ANON_KEY "$anon"
          sjekk E2E_SUPABASE_SERVICE_KEY "$secret"
          if [ "$feil" -ne 0 ]; then
            echo "Feltnavn CLI-en faktisk ga (verdier utelatt med vilje):"
            cut -d= -f1 supabase-status.env
            exit 1
          fi

          # Bygget kjørte allerede mot LOKAL_SUPABASE_* (se «Bygg»). Avviker
          # instansen som faktisk startet, peker artefaktet feil — stopp her.
          # Verdiene skrives ut: det er CLI-ens offentlige dev-verdier.
          if [ "$url" != "$LOKAL_SUPABASE_URL" ] || [ "$anon" != "$LOKAL_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Lokal Supabase ga andre verdier enn bygget brukte. Fikk url=$url anon=$anon — oppdater LOKAL_SUPABASE_* i job-env."
            exit 1
          fi

          # Skriver KUN disse tre til $GITHUB_ENV. Bevisst ALDRI
          # NEXT_PUBLIC_SUPABASE_*/SUPABASE_SERVICE_ROLE_KEY her — pinningen i
          # playwright.config.ts (config-vakten, se e2e/README.md §
          # Sikkerhetsmodellen) skal være det som setter dem. Setter vi
          # NEXT_PUBLIC_*-variablene direkte i workflow-env, omgår vi den vakten
          # og sikkerhetsvakt.spec.ts mister sin betydning i CI. At vi plukker
          # tre navngitte verdier — i stedet for å appende hele stdout — er også
          # det som holder DB_URL/JWT_SECRET/S3_PROTOCOL_* ute av jobb-env.
          {
            echo "E2E_SUPABASE_URL=$url"
            echo "E2E_SUPABASE_ANON_KEY=$anon"
            echo "E2E_SUPABASE_SERVICE_KEY=$secret"
          } >> "$GITHUB_ENV"

      # Fanger «grønn på tom luft»: en migrasjon som feiler stille (eller aldri
      # ble lagt til supabase/migrations/) skal gjøre jobben rød, ikke la
      # e2e kjøre mot et ufullstendig skjema. psql er forhåndsinstallert på
      # ubuntu-latest; på egen runner installert av oppsettskriptet (#891).
      - name: Verifiser at alle migrasjoner kjørte
        if: steps.omfang.outputs.e2e == 'true'
        run: |
          export PGPASSWORD=postgres
          kjort=$(psql -h 127.0.0.1 -p "$LOKAL_DB_PORT" -U postgres -d postgres -tAc \
            "select count(*) from supabase_migrations.schema_migrations")
          kjort=$(echo "$kjort" | tr -d '[:space:]')
          # Tom output med exit 0 fra psql ville sluppet gjennom stille:
          # `[ "" -ne "123" ]` returnerer 2 (syntaksfeil), og `if` leser 2 som
          # usant — altså «ingen avvik». Sjekk derfor at vi faktisk fikk et tall.
          if [ -z "$kjort" ]; then
            echo "::error::psql ga tom migrasjonstelling — kunne ikke verifisere skjemaet."
            exit 1
          fi
          pa_disk=$(ls -1 supabase/migrations/*.sql | wc -l)
          echo "Migrasjoner kjørt i DB: $kjort — filer i supabase/migrations/: $pa_disk"
          if [ "$kjort" -ne "$pa_disk" ]; then
            echo "::error::Migrasjonsavvik — $kjort kjørt mot $pa_disk filer på disk. En migrasjon feilet stille eller mangler."
            exit 1
          fi

      # Verifiserer migrasjon 161 mot den seedede databasen: klassifiseringen
      # (klubbeid / unntak) er lik __tests__/helpers/klubb-tabeller.ts, og alle
      # rader tilhører standardklubben. Unntakslista her vaktes av
      # __tests__/migrasjon-klubb-id.test.ts.
      - name: Verifiser klubb_id på klubbeide tabeller
        if: steps.omfang.outputs.e2e == 'true'
        run: |
          export PGPASSWORD=postgres
          if ! psql -h 127.0.0.1 -p "$LOKAL_DB_PORT" -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            unntak constant text[] := array['klubb','profiles','push_subscriptions','pass_info'];
            t text;
            avvik text[] := '{}';
            antall int := 0;
            ukjent bigint;
            attnum_klubb_id smallint;
          begin
            for t in
              select table_name::text from information_schema.tables
              where table_schema = 'public' and table_type = 'BASE TABLE'
                and table_name <> all (unntak)
              order by table_name
            loop
              antall := antall + 1;
              if not exists (
                select 1 from information_schema.columns
                where table_schema = 'public' and table_name = t and column_name = 'klubb_id'
                  and data_type = 'uuid' and is_nullable = 'NO'
                  and column_default ~ 'standard_klubb_id\(\)'
              ) then
                avvik := avvik || (t || ': klubb_id mangler, er nullable eller mangler default');
                continue;
              end if;
              select attnum into attnum_klubb_id from pg_attribute
                where attrelid = format('public.%I', t)::regclass and attname = 'klubb_id';
              if not exists (
                select 1 from pg_constraint
                where contype = 'f'
                  and conrelid = format('public.%I', t)::regclass
                  and confrelid = 'public.klubb'::regclass
                  and conkey = array[attnum_klubb_id]
                  and confupdtype = 'c' and confdeltype = 'r'
              ) then
                avvik := avvik || (t || ': fremmednøkkel til klubb mangler eller har feil on update/delete');
              end if;
              execute format('select count(*) from public.%I where klubb_id is distinct from public.standard_klubb_id()', t) into ukjent;
              if ukjent <> 0 then
                avvik := avvik || (t || ': ' || ukjent || ' rader med annen klubb_id enn standardklubben');
              end if;
            end loop;

            foreach t in array unntak loop
              if not exists (select 1 from information_schema.tables where table_schema = 'public' and table_name = t) then
                avvik := avvik || (t || ': unntakstabell finnes ikke');
              elsif exists (select 1 from information_schema.columns where table_schema = 'public' and table_name = t and column_name = 'klubb_id') then
                avvik := avvik || (t || ': unntakstabell har klubb_id');
              end if;
            end loop;

            if antall = 0 then
              avvik := avvik || 'ingen klubbeide tabeller funnet';
            end if;
            if has_function_privilege('anon', 'public.standard_klubb_id()', 'execute') then
              avvik := avvik || 'anon har execute på standard_klubb_id()';
            end if;
            if not has_function_privilege('authenticated', 'public.standard_klubb_id()', 'execute') then
              avvik := avvik || 'authenticated mangler execute på standard_klubb_id()';
            end if;
            if not has_function_privilege('service_role', 'public.standard_klubb_id()', 'execute') then
              avvik := avvik || 'service_role mangler execute på standard_klubb_id()';
            end if;

            if cardinality(avvik) > 0 then
              raise exception 'klubb_id-avvik: %', array_to_string(avvik, E'\n  ');
            end if;
            raise notice 'klubb_id verifisert på % klubbeide tabeller', antall;
          end
          $$;
          SQL
          then
            echo "::error::klubb_id-verifiseringen feilet — se psql-utskriften over."
            exit 1
          fi

      # Multi-tenant 1.4 (#867): katalogvakt for unike nøkler. Migrasjonene er
      # ikke parsbare for dette (nøkler kan lages i do $$), så vakten leser
      # pg_index. Hver unik indeks (PK, unique, unique index) på en tabell med
      # klubb_id må enten (a) ha klubb_id som FØRSTE nøkkelkolonne, (b) være
      # surrogat (én kolonne som heter id), eller (c) ha en kolonne som er FK til
      # en klubbeid forelder (klubben følger forelderen): enten en enkeltkolonne,
      # eller — etter 2.1b (#895) — en sammensatt FK (klubb_id, kol) mot
      # forelder(klubb_id, id), der kolonnen inngår sammen med klubb_id. Ingen
      # unntaksliste. klubb_id lenger ut i nøkkelen eller som INCLUDE-kolonne er
      # rødt: kun nøkkelkolonnene (indkey[0 .. indnkeyatts-1]) telles.
      - name: Verifiser unike nøkler per klubb
        if: steps.omfang.outputs.e2e == 'true'
        run: |
          export PGPASSWORD=postgres
          if ! psql -h 127.0.0.1 -p "$LOKAL_DB_PORT" -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            r record;
            avvik text[] := '{}';
            n_endres int := 0;
            n_forelder int := 0;
            n_surrogat int := 0;
          begin
            for r in
              select
                c.relname::text as tabell,
                ic.relname::text as indeks,
                i.indrelid,
                -- Kun nøkkelkolonner: INCLUDE-kolonner ligger etter indnkeyatts.
                -- int2vector er 0-basert, int2[] fra string_to_array 1-basert.
                (string_to_array(i.indkey::text, ' ')::int2[])[1:i.indnkeyatts] as kolonner,
                (select attnum from pg_attribute where attrelid = i.indrelid and attname = 'klubb_id') as klubb_attnum
              from pg_index i
              join pg_class c on c.oid = i.indrelid
              join pg_class ic on ic.oid = i.indexrelid
              join pg_namespace ns on ns.oid = c.relnamespace
              where ns.nspname = 'public' and i.indisunique and c.relkind = 'r'
                and exists (select 1 from pg_attribute where attrelid = i.indrelid and attname = 'klubb_id' and not attisdropped)
              order by c.relname, ic.relname
            loop
              if r.kolonner[1] = r.klubb_attnum then
                n_endres := n_endres + 1;
              elsif r.klubb_attnum = any (r.kolonner) then
                avvik := avvik || (r.tabell || '.' || r.indeks || ': klubb_id er med i nøkkelen, men ikke først');
              elsif (cardinality(r.kolonner) = 1 and exists (select 1 from pg_attribute where attrelid = r.indrelid and attnum = r.kolonner[1] and attname = 'id')) then
                n_surrogat := n_surrogat + 1;
              elsif exists (
                select 1 from unnest(r.kolonner) as k(attnum)
                join pg_constraint fk on fk.contype = 'f' and fk.conrelid = r.indrelid
                join pg_attribute fa on fa.attrelid = fk.confrelid and fa.attname = 'klubb_id' and not fa.attisdropped
                where k.attnum > 0
                  and (fk.conkey = array[k.attnum]
                       -- Sammensatt FK: sammenlign de ORDNEDE kolonneparene (barn → forelder),
                       -- ikke mengdene — (k, klubb_id) → (klubb_id, id) er koblet feil og skal
                       -- ikke telle (review av #895). Krever klubb_id → klubb_id og k → en
                       -- annen forelderkolonne enn klubb_id.
                       or (cardinality(fk.conkey) = 2
                           and exists (select 1 from unnest(fk.conkey, fk.confkey) as p(barn, forelder)
                                        where p.barn = r.klubb_attnum and p.forelder = fa.attnum)
                           and exists (select 1 from unnest(fk.conkey, fk.confkey) as p(barn, forelder)
                                        where p.barn = k.attnum and p.forelder <> fa.attnum)))
              ) then
                n_forelder := n_forelder + 1;
              else
                avvik := avvik || (r.tabell || '.' || r.indeks || ': unik nøkkel uten klubb_id først, ikke surrogat og ikke via klubbeid forelder');
              end if;
            end loop;

            if cardinality(avvik) > 0 then
              raise exception 'nøkkel-avvik: %', array_to_string(avvik, E'\n  ');
            end if;
            raise notice 'unike nøkler: % med klubb_id først, % via forelder, % surrogat', n_endres, n_forelder, n_surrogat;
          end
          $$;
          SQL
          then
            echo "::error::Verifiseringen av unike nøkler feilet — se psql-utskriften over."
            exit 1
          fi

      - name: Verifiser medlemskap per klubb
        if: steps.omfang.outputs.e2e == 'true'
        run: |
          export PGPASSWORD=postgres
          if ! psql -h 127.0.0.1 -p "$LOKAL_DB_PORT" -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 <<'SQL'
          begin;

          -- 1) Speilet stemmer rett etter seed, og bare standardklubben har medlemskap.
          do $$
          declare
            a bigint;
            k bigint;
          begin
            select avvik, klubber into a, k from public.medlemskap_speil_avvik();
            if a <> 0 or k <> 1 then
              raise exception 'speil-avvik rett etter seed: avvik=% klubber=%', a, k;
            end if;
          end
          $$;

          -- 2) Paritet mellom kroppene: er_admin()/er_generalsekretaer() og overlasten
          --    med standard_klubb_id() skal gi samme svar for hver profil.
          do $$
          declare
            ider uuid[];
            i uuid;
          begin
            select array_agg(id) into ider from public.profiles;
            foreach i in array ider loop
              perform set_config('request.jwt.claims', json_build_object('sub', i, 'role', 'authenticated')::text, true);
              set local role authenticated;
              if public.er_admin() is distinct from public.er_admin(public.standard_klubb_id()) then
                reset role;
                raise exception 'er_admin() og er_admin(standard_klubb_id()) er ulike for %', i;
              end if;
              if public.er_generalsekretaer() is distinct from public.er_generalsekretaer(public.standard_klubb_id()) then
                reset role;
                raise exception 'er_generalsekretaer() og er_generalsekretaer(standard_klubb_id()) er ulike for %', i;
              end if;
              reset role;
            end loop;
          end
          $$;

          -- 3) Paritetsbrudd fanges ved commit: trigger slått av, rolle skrevet rett på
          --    profiles, og de utsatte triggerne tvinges til å kjøre. Gjøres FØR det
          --    står utsatte hendelser på profiles (alter table feiler da).
          do $$
          declare
            melding text;
          begin
            begin
              alter table public.profiles disable trigger beskytt_profil_kolonner;
              update public.profiles set rolle = 'admin' where id = '00000000-0000-4000-8000-000000000002';
              execute 'set constraints all immediate';
              melding := 'ingen feil';
            exception when others then
              melding := sqlerrm;
            end;
            if melding not like 'medlemskap.speil.paritet:%' then
              raise exception 'forventet paritetsbrudd, fikk: %', melding;
            end if;
          end
          $$;

          -- 3b) Flytting av et medlemskap mellom profiler med speiltriggeren av: den
          --     GAMLE profilen står igjen med foreldet speil og skal fanges (review
          --     av #868). Y og X er to midlertidige brukere UTEN innhold (siden 2.1b,
          --     #895, ville sletting av et medlemskap med innhold gitt 23503 i
          --     stedet for paritetsmeldingen); handle_ny_bruker gir dem profil +
          --     medlemskap. X gis først Y sine verdier (speilet på), så den nye
          --     profilen er i paritet og bare den gamle kan utløse bruddet.
          do $$
          declare
            y uuid;
            x uuid;
            melding text;
          begin
            y := '00000000-0000-4000-8000-00000000fb01';
            x := '00000000-0000-4000-8000-00000000fb02';
            insert into auth.users (id, instance_id, aud, role, email, raw_app_meta_data, raw_user_meta_data, created_at, updated_at)
            values (y, '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'speil-y@x.test', '{}', '{}', now(), now()),
                   (x, '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'speil-x@x.test', '{}', '{}', now(), now());
            begin
              update public.medlemskap m
                 set (rolle, aktiv, faar_issue_varsler, faar_feilvarsler, bursdagsgratulasjon_aktiv) =
                     (select rolle, aktiv, faar_issue_varsler, faar_feilvarsler, bursdagsgratulasjon_aktiv
                        from public.medlemskap
                       where klubb_id = '00000000-0000-4000-a000-000000000001' and profil_id = y)
               where m.klubb_id = '00000000-0000-4000-a000-000000000001' and m.profil_id = x;
              -- Tøm køen av utsatte hendelser, ellers nekter alter table.
              execute 'set constraints all immediate';
              alter table public.medlemskap disable trigger medlemskap_speil_til_profiles;
              execute 'set constraints all deferred';
              delete from public.medlemskap
               where klubb_id = '00000000-0000-4000-a000-000000000001' and profil_id = x;
              update public.medlemskap set profil_id = x
               where klubb_id = '00000000-0000-4000-a000-000000000001' and profil_id = y;
              execute 'set constraints all immediate';
              melding := 'ingen feil';
            exception when others then
              melding := sqlerrm;
            end;
            execute 'set constraints all deferred';
            if melding not like 'medlemskap.speil.paritet: profil=' || y || '%' then
              raise exception 'forventet paritetsbrudd for gammel profil %, fikk: %', y, melding;
            end if;
          end
          $$;

          -- 4) Klubb 2: Petter er admin og Ola generalsekretær der.
          insert into public.klubb (id, slug, navn)
            values ('00000000-0000-4000-a000-000000000002', 'proeve', 'Prøveklubben');
          insert into public.medlemskap (klubb_id, profil_id, rolle) values
            ('00000000-0000-4000-a000-000000000002', '00000000-0000-4000-8000-000000000002', 'admin'),
            ('00000000-0000-4000-a000-000000000002', '00000000-0000-4000-8000-000000000003', 'generalsekretaer');

          -- 4b) Triggeren på medlemskap (164): medlemskap i klubb 2 gir varselvalg i klubb 2.
          do $$
          declare
            antall bigint;
          begin
            select count(*) into antall from public.varsel_preferanser
             where klubb_id = '00000000-0000-4000-a000-000000000002'
               and profil_id in ('00000000-0000-4000-8000-000000000002', '00000000-0000-4000-8000-000000000003');
            if antall <> 2 then
              raise exception 'medlemskap i klubb 2 skulle gitt 2 varsel_preferanser-rader i klubb 2, fant %', antall;
            end if;
          end
          $$;

          -- 5) Som Petter: admin bare i klubb 2, og profiles.rolle er urørt.
          do $$
          declare
            rolle_p text;
          begin
            perform set_config('request.jwt.claims',
              json_build_object('sub', '00000000-0000-4000-8000-000000000002', 'role', 'authenticated')::text, true);
            set local role authenticated;
            if not public.er_admin('00000000-0000-4000-a000-000000000002') then
              reset role;
              raise exception 'Petter skulle vært admin i klubb 2';
            end if;
            if public.er_admin() or public.er_admin('00000000-0000-4000-a000-000000000001') then
              reset role;
              raise exception 'Petter skal ikke være admin i standardklubben';
            end if;
            reset role;
            select rolle into rolle_p from public.profiles where id = '00000000-0000-4000-8000-000000000002';
            if rolle_p <> 'medlem' then
              raise exception 'profiles.rolle for Petter skulle vært medlem, er %', rolle_p;
            end if;
          end
          $$;

          -- 6) GS nr. 2 i standardklubben avvises av den partielle unike indeksen.
          do $$
          begin
            begin
              update public.medlemskap set rolle = 'generalsekretaer'
               where klubb_id = '00000000-0000-4000-a000-000000000001'
                 and profil_id = '00000000-0000-4000-8000-000000000002';
              raise exception 'forventet 23505, men oppdateringen gikk gjennom';
            exception when unique_violation then
              null;
            end;
          end
          $$;

          -- 7) Vernet gjelder også postgres/service_role: direkte skriving av rolle på profiles.
          do $$
          declare
            melding text;
          begin
            begin
              update public.profiles set rolle = 'admin' where id = '00000000-0000-4000-8000-000000000002';
              melding := 'ingen feil';
            exception when others then
              melding := sqlerrm;
            end;
            if melding not like 'medlemskap.speil.vern%' then
              raise exception 'forventet medlemskap.speil.vern, fikk: %', melding;
            end if;
          end
          $$;

          -- 8) Prod-vakten ser den andre klubben.
          do $$
          declare
            k bigint;
          begin
            select klubber into k from public.medlemskap_speil_avvik();
            if k <> 2 then
              raise exception 'medlemskap_speil_avvik() skulle sett 2 klubber, så %', k;
            end if;
          end
          $$;

          rollback;
          SQL
          then
            echo "::error::Verifiseringen av medlemskap per klubb feilet — se psql-utskriften over."
            exit 1
          fi

      # Multi-tenant 2.1b (#895): sammensatte fremmednøkler. Katalogsjekken er
      # vakten mot at en ny FK mellom klubbeide tabeller glemmer klubb_id, eller
      # at en ny profilkolonne glemmer medlemskap-FK-en; resten beviser at
      # databasen faktisk gjør det migrasjon 165 lover (avvisning, set null med
      # kolonneliste, omnummerering, profilsletting). Alt i én transaksjon som
      # rulles tilbake. Unntakslista «bare personen» speiler PROFIL_FK_BARE_PERSON
      # i __tests__/helpers/klubb-tabeller.ts (vaktet av migrasjon-165.test.ts).
      - name: Verifiser sammensatte fremmednøkler
        if: steps.omfang.outputs.e2e == 'true'
        run: |
          export PGPASSWORD=postgres
          if ! psql -h 127.0.0.1 -p "$LOKAL_DB_PORT" -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 <<'SQL'
          begin;

          -- 1) Katalogsjekk.
          do $$
          declare
            r record;
            avvik text[] := '{}';
            bare_person constant text[] := array[
              'pass_tilgang_forespørsel.besluttet_av', 'bursdagsbilde.slettet_av', 'feil_logg.profil_id',
              'fond_navn_alias.opprettet_av', 'fond_verdi_historikk.endret_av', 'vedtekter_versjoner.endret_av',
              'varsel_logg.profil_id', 'push_subscriptions.profil_id', 'pass_info.profil_id', 'medlemskap.profil_id'
            ];
          begin
            -- a) Hver FK mellom to tabeller med klubb_id (unntatt mot klubb selv) kobler barnets
            --    klubb_id til forelderens klubb_id i samme posisjon, og ingen annen kolonne
            --    kobles til eller fra klubb_id. Kolonneparene sammenlignes ordnet — å bare
            --    sjekke at klubb_id står et sted i conkey og confkey slapp gjennom
            --    (forelder_id, klubb_id) → (klubb_id, id) (review av #895).
            for r in
              select c.conname::text as navn, (select relname::text from pg_class where oid = c.conrelid) as barn
              from pg_constraint c
              join pg_attribute ba on ba.attrelid = c.conrelid and ba.attname = 'klubb_id' and not ba.attisdropped
              join pg_attribute fa on fa.attrelid = c.confrelid and fa.attname = 'klubb_id' and not fa.attisdropped
              where c.contype = 'f' and c.connamespace = 'public'::regnamespace
                and c.confrelid <> 'public.klubb'::regclass
                and (
                  not exists (select 1 from unnest(c.conkey, c.confkey) as p(barn, forelder)
                               where p.barn = ba.attnum and p.forelder = fa.attnum)
                  or exists (select 1 from unnest(c.conkey, c.confkey) as p(barn, forelder)
                              where (p.barn = ba.attnum) <> (p.forelder = fa.attnum))
                )
              order by 2, 1
            loop
              avvik := avvik || (r.barn || '.' || r.navn || ': FK mellom klubbeide tabeller kobler ikke klubb_id → klubb_id (sjekk kolonnerekkefølgen)');
            end loop;

            -- b) Hver FK fra en klubbeid tabell til profiles har en medlemskap-FK på samme kolonne, med mindre kolonnen er «bare personen».
            for r in
              select (select relname::text from pg_class where oid = c.conrelid) as barn, a.attname::text as kol,
                     ba.attnum as klubb_attnum, a.attnum as kol_attnum, c.conrelid
              from pg_constraint c
              join pg_attribute a on a.attrelid = c.conrelid and a.attnum = c.conkey[1]
              join pg_attribute ba on ba.attrelid = c.conrelid and ba.attname = 'klubb_id' and not ba.attisdropped
              where c.contype = 'f' and c.connamespace = 'public'::regnamespace
                and c.confrelid = 'public.profiles'::regclass and cardinality(c.conkey) = 1
              order by 1, 2
            loop
              if (r.barn || '.' || r.kol) = any (bare_person) then
                continue;
              end if;
              if not exists (
                select 1 from pg_constraint m
                where m.contype = 'f' and m.conrelid = r.conrelid
                  and m.confrelid = 'public.medlemskap'::regclass
                  -- Ordnede par, ikke bare conkey: klubb_id → medlemskap.klubb_id og
                  -- kolonnen → medlemskap.profil_id (review av #895).
                  and cardinality(m.conkey) = 2
                  and exists (select 1 from unnest(m.conkey, m.confkey) as p(barn, forelder)
                               where p.barn = r.klubb_attnum
                                 and p.forelder = (select attnum from pg_attribute where attrelid = 'public.medlemskap'::regclass and attname = 'klubb_id'))
                  and exists (select 1 from unnest(m.conkey, m.confkey) as p(barn, forelder)
                               where p.barn = r.kol_attnum
                                 and p.forelder = (select attnum from pg_attribute where attrelid = 'public.medlemskap'::regclass and attname = 'profil_id'))
              ) then
                avvik := avvik || (r.barn || '.' || r.kol || ': FK mot profiles uten medlemskap-FK (legg til, eller før kolonnen på PROFIL_FK_BARE_PERSON)');
              end if;
            end loop;

            -- Unntakslista skal ikke inneholde kolonner som ikke finnes (foreldet unntak).
            for r in
              select u.navn from unnest(bare_person) as u(navn)
              where not exists (
                select 1 from pg_constraint c
                join pg_attribute a on a.attrelid = c.conrelid and a.attnum = c.conkey[1]
                where c.contype = 'f' and c.connamespace = 'public'::regnamespace
                  and c.confrelid = 'public.profiles'::regclass and cardinality(c.conkey) = 1
                  and (select relname::text from pg_class where oid = c.conrelid) || '.' || a.attname = u.navn
              )
            loop
              avvik := avvik || (r.navn || ': står på «bare personen»-lista, men er ikke en FK mot profiles');
            end loop;

            if cardinality(avvik) > 0 then
              raise exception 'FK-avvik: %', array_to_string(avvik, E'\n  ');
            end if;
          end
          $$;

          -- 2) Klubb 2 med Petter som medlem. Barn i klubb 2 mot forelder i klubb 1 avvises av riktig FK.
          insert into public.klubb (id, slug, navn)
            values ('00000000-0000-4000-a000-000000000002', 'fk-prove', 'FK-prøveklubben');
          insert into public.medlemskap (klubb_id, profil_id)
            values ('00000000-0000-4000-a000-000000000002', '00000000-0000-4000-8000-000000000002');

          do $$
          declare
            arr uuid;
            navn text;
          begin
            select id into arr from public.arrangementer
             where klubb_id = '00000000-0000-4000-a000-000000000001' limit 1;
            if arr is null then
              raise exception 'fant ingen arrangement i standardklubben';
            end if;

            -- Forelder i annen klubb.
            begin
              insert into public.arrangement_chat (klubb_id, arrangement_id, profil_id, innhold)
              values ('00000000-0000-4000-a000-000000000002', arr, '00000000-0000-4000-8000-000000000002', 'hei');
              raise exception 'forventet 23503 for chatmelding i klubb 2 mot arrangement i klubb 1';
            exception when foreign_key_violation then
              get stacked diagnostics navn = constraint_name;
              if navn <> 'arrangement_chat_arrangement_id_fkey' then
                raise exception 'feil FK avviste kryssklubb-chatmeldingen: %', navn;
              end if;
            end;

            -- Profil uten medlemskap i klubben (Ola har bare medlemskap i klubb 1).
            begin
              insert into public.klubb_chat (klubb_id, profil_id, innhold)
              values ('00000000-0000-4000-a000-000000000002', '00000000-0000-4000-8000-000000000003', 'hei');
              raise exception 'forventet 23503 for klubb_chat uten medlemskap i klubben';
            exception when foreign_key_violation then
              get stacked diagnostics navn = constraint_name;
              if navn <> 'klubb_chat_profil_id_medlemskap_fkey' then
                raise exception 'feil FK avviste raden uten medlemskap: %', navn;
              end if;
            end;

            -- Kontroll: samme slags rad i riktig klubb går gjennom.
            insert into public.klubb_chat (klubb_id, profil_id, innhold)
            values ('00000000-0000-4000-a000-000000000002', '00000000-0000-4000-8000-000000000002', 'hei');
          end
          $$;

          -- 3) on delete set null med kolonneliste: forelderen slettes, klubb_id står.
          do $$
          declare
            arr uuid;
            pid uuid;
            ark uuid;
            k_id uuid;
          begin
            insert into public.arrangementer (tittel, type, start_tidspunkt, opprettet_av)
            values ('fk-prøve', 'moete', now(), '00000000-0000-4000-8000-000000000002')
            returning id into arr;
            insert into public.poll (spoersmaal, svarfrist, opprettet_av, arrangement_id)
            values ('fk-prøve?', now() + interval '1 day', '00000000-0000-4000-8000-000000000002', arr)
            returning id into pid;
            delete from public.arrangementer where id = arr;
            select arrangement_id, klubb_id into ark, k_id from public.poll where id = pid;
            if ark is not null then
              raise exception 'poll.arrangement_id skulle vært null etter sletting av arrangementet';
            end if;
            if k_id is distinct from '00000000-0000-4000-a000-000000000001'::uuid then
              raise exception 'poll.klubb_id skulle stått urørt, er %', k_id;
            end if;
          end
          $$;

          -- 4) Omnummerering av klubben går gjennom alle FK-ene (on update cascade).
          savepoint omnummerering;
          update public.klubb set id = gen_random_uuid() where id = '00000000-0000-4000-a000-000000000001';
          rollback to savepoint omnummerering;

          -- 5) Profilsletting: en auth-bruker med innhold i klubben forsvinner uten feil.
          insert into auth.users (id, instance_id, aud, role, email, raw_app_meta_data, raw_user_meta_data, created_at, updated_at)
          values ('00000000-0000-4000-8000-00000000fa01', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated',
                  'fk-prove-1@x.test', '{}', '{}', now(), now());
          do $$
          declare
            arr uuid;
            u constant uuid := '00000000-0000-4000-8000-00000000fa01';
          begin
            select id into arr from public.arrangementer
             where klubb_id = '00000000-0000-4000-a000-000000000001' limit 1;
            insert into public.arrangementer (tittel, type, start_tidspunkt, opprettet_av)
              values ('fk-prøve 2', 'moete', now(), u);
            -- Skaperen påmeldes av en trigger på arrangementer; på conflict gjør raden uavhengig av det.
            insert into public.paameldinger (arrangement_id, profil_id, status) values (arr, u, 'ja') on conflict do nothing;
            insert into public.klubb_chat (profil_id, innhold) values (u, 'hei');
            insert into public.arrangement_chat (arrangement_id, profil_id, innhold) values (arr, u, 'hei');
            delete from auth.users where id = u;
            if exists (select 1 from public.profiles where id = u)
               or exists (select 1 from public.medlemskap where profil_id = u)
               or exists (select 1 from public.paameldinger where profil_id = u)
               or exists (select 1 from public.klubb_chat where profil_id = u) then
              raise exception 'sletting av auth-brukeren skulle fjernet profil, medlemskap og innhold';
            end if;
          end
          $$;

          -- 6) Medlemskapet kan ikke slettes alene mens personen har innhold i klubben.
          insert into auth.users (id, instance_id, aud, role, email, raw_app_meta_data, raw_user_meta_data, created_at, updated_at)
          values ('00000000-0000-4000-8000-00000000fa02', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated',
                  'fk-prove-2@x.test', '{}', '{}', now(), now());
          insert into public.klubb_chat (profil_id, innhold) values ('00000000-0000-4000-8000-00000000fa02', 'hei');
          do $$
          begin
            begin
              delete from public.medlemskap where profil_id = '00000000-0000-4000-8000-00000000fa02';
              raise exception 'forventet 23503 ved sletting av medlemskap med innhold';
            exception when foreign_key_violation then
              null;
            end;
          end
          $$;

          rollback;
          SQL
          then
            echo "::error::Verifiseringen av sammensatte fremmednøkler feilet — se psql-utskriften over."
            exit 1
          fi

      # process.env.CI settes automatisk til 'true' av GitHub Actions-runneren —
      # ingen egen env-linje trengs for at playwright.config.ts sine
      # CI-betingede justeringer (retries, forbidOnly, testIgnore av
      # visuell/readme-skjermbilder osv.) skal slå inn.
      - name: E2e (Playwright)
        if: steps.omfang.outputs.e2e == 'true'
        run: npx playwright test

      # Diagnostisk, ikke en port (#659). always() + continue-on-error: sier
      # ALDRI noe om hvorvidt kjøringen var grønn eller rød — den skal svare
      # på ETT spørsmål: rev runneren en prosess i minnekrise underveis?
      # ::warning:: (IKKE ::error::) med vilje: et OOM-spor på en GRØNN
      # kjøring er det farligste utfallet (et symptom som ikke slo ut som
      # rødt ENDA), og en error her ville skapt falsk rødt på noe dette steget
      # ikke skal ha makt til å felle jobben på.
      - name: Diagnose etter e2e (OOM-spor)
        if: always() && steps.omfang.outputs.e2e == 'true'
        continue-on-error: true
        run: |
          echo "### Minne (free -m)"
          free -m || true

          echo "### dmesg — søk etter OOM/killed process"
          funn=$(sudo dmesg -T 2>/dev/null | grep -iE 'oom|killed process|out of memory' || true)
          if [ -n "$funn" ]; then
            echo "::warning::Mulig OOM-spor funnet i dmesg under denne kjøringen — se logg under."
            echo "$funn"
          else
            echo "Ingen OOM-spor."
          fi

          echo "### Docker-containere som har avsluttet (exited)"
          docker ps -a --filter status=exited || true

      # GitHub-hosted runnere kastes etter jobben; egen runner gjør det ikke.
      # Uten dette steget ble hk-ci-containerne stående og tok minne fra neste
      # kjøring (og fra test-instansen). --no-backup: instansen er engangsbruk.
      # always(): skal rydde også etter rød e2e og etter timeout.
      - name: Stopp CI-instansen (egen runner)
        if: always() && runner.environment == 'self-hosted' && steps.omfang.outputs.e2e == 'true'
        run: npx supabase stop --no-backup || true

      # #800: `if: failure()` ga aldri noe artefakt for en FLAKY test — retry
      # i config.ts gjorde jobben grønn, og skjermbildet + error-context.md
      # fra det mislykkede første forsøket ble aldri lastet opp. `always()`
      # laster opp uansett utfall; `if-no-files-found: ignore` fordi en helt
      # grønn kjøring (ingen retries brukt) ikke produserer noen av mappene.
      # (Trace er bevisst av i CI — se playwright.config.ts.)
      - name: Last opp Playwright-artefakter (feil og flaky)
        if: always() && steps.omfang.outputs.e2e == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore
